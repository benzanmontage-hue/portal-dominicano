<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Portal Dominicano — App de Lotería, Radio y Tiempo RD</title>
<meta name="description" content="App dominicana: lotería, radio, tiempo, MLB, tendencias y más.">
<meta name="theme-color" content="#002a5c">
<meta name="robots" content="noindex,follow">
<link rel="canonical" href="https://portaldominicana.net/">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Portal RD">
<link rel="apple-touch-icon" href="img/icon-192.png">
<link rel="icon" type="image/png" href="img/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --azul:#002a5c; --azul2:#0a5bbf; --rojo:#d90429; --rojo2:#ef233c;
  --bg:#f4f6fb; --card:#ffffff; --border:#e5eaf3; --border2:#d8e0ee;
  --txt:#0d1b33; --muted:#64748b; --gold:#f5b942;
  --shadow-sm:0 1px 2px rgba(13,27,51,.04),0 2px 6px rgba(13,27,51,.04);
  --shadow:0 2px 4px rgba(13,27,51,.04),0 8px 20px rgba(13,27,51,.07);
  --shadow-lg:0 12px 32px rgba(13,27,51,.14);
  --radius:16px;
  --grad:linear-gradient(135deg,var(--azul),var(--rojo));
  --tab-h:60px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0b1220; --card:#121a2b; --border:#1e2a44; --border2:#2a3a5c;
    --txt:#e7edf8; --muted:#8b9bb8;
    --shadow-sm:0 1px 2px rgba(0,0,0,.3),0 2px 6px rgba(0,0,0,.25);
    --shadow:0 2px 4px rgba(0,0,0,.3),0 8px 20px rgba(0,0,0,.35);
    --shadow-lg:0 12px 32px rgba(0,0,0,.5);
  }
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow:hidden}

/* App shell */
#app{height:100%;display:flex;flex-direction:column;max-width:520px;margin:0 auto}
.app-header{position:relative;overflow:hidden;background:var(--azul);color:#fff;padding:14px 16px 13px;display:flex;align-items:center;gap:10px;flex:0 0 auto}
.app-header::before{content:"";position:absolute;inset:-40%;background:radial-gradient(40% 60% at 20% 0%,rgba(239,35,60,.5),transparent 60%),radial-gradient(50% 70% at 90% 20%,rgba(10,91,191,.6),transparent 60%);filter:blur(24px)}
.app-header>*{position:relative;z-index:1}
.app-header .escudo{width:40px;height:40px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.35))}
.app-header .t{flex:1}
.app-header .t h1{font-size:1.05rem;font-weight:900;letter-spacing:-.02em}
.app-header .t .lema{font-size:.6rem;letter-spacing:.26em;text-transform:uppercase;opacity:.85;font-weight:600}
.app-header .updated{font-size:.66rem;background:rgba(255,255,255,.14);padding:4px 11px;border-radius:999px;font-weight:600;border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(6px)}

/* Screens */
#screens{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px 8px}
.screen{display:none}
.screen.active{display:block;animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

h2.sec{font-size:1rem;font-weight:800;margin:10px 0 10px;display:flex;align-items:center;gap:8px;letter-spacing:-.01em}
h2.sec .bar{width:4px;height:16px;border-radius:99px;background:var(--grad)}
h2.sec .meta{font-size:.72rem;color:var(--muted);font-weight:600;margin-left:auto}

/* Lotería */
.lot-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.lot-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px;box-shadow:var(--shadow-sm);transition:transform .18s,box-shadow .18s}
.lot-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.lot-card .comp{font-size:.6rem;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--rojo)}
.lot-comp{grid-column:1/-1;font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--azul2);margin:8px 0 0;padding-bottom:5px;border-bottom:2px solid var(--border);display:flex;align-items:center;gap:7px}
.lot-comp::before{content:"";width:9px;height:9px;border-radius:3px;background:var(--grad)}
.lot-card .game{font-size:.85rem;font-weight:700;margin-top:1px}
.lot-card .nums{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.ball{min-width:38px;height:38px;padding:0 6px;display:inline-flex;align-items:center;justify-content:center;background:var(--bg);border:1px solid var(--border);border-radius:10px;font-weight:800;font-size:.95rem;font-variant-numeric:tabular-nums;box-shadow:inset 0 -2px 0 rgba(0,0,0,.04)}
.ball.gold{background:linear-gradient(180deg,#ffe08a,#f2b32e);color:#3d2800;border-color:#e6a800;box-shadow:inset 0 -2px 0 rgba(0,0,0,.08)}
.lot-meta{display:flex;align-items:center;gap:6px;margin-top:3px;flex-wrap:wrap}
.lot-fecha{font-size:.62rem;font-weight:700;color:var(--muted);background:var(--bg);border:1px solid var(--border);border-radius:999px;padding:1px 8px}
.lot-dia{font-size:.6rem;font-weight:800;color:#b91c1c;background:rgba(206,17,38,.1);border:1px solid rgba(206,17,38,.25);border-radius:999px;padding:1px 7px}

/* MLB */

/* Tendencias */
.tend-list{display:flex;flex-direction:column;gap:8px}
.tend{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:11px 13px;display:flex;gap:10px;align-items:flex-start;box-shadow:var(--shadow-sm);transition:transform .18s}
.tend:hover{transform:translateX(3px)}
.tend .rank{font-weight:900;font-size:1.05rem;color:var(--azul2);min-width:24px;text-align:center;line-height:1.3;font-variant-numeric:tabular-nums}
.tend .rank.hot{color:var(--rojo)}
.tend .body{flex:1;min-width:0}
.tend .term{font-weight:800;font-size:.9rem}
.tend .traf{display:inline-block;margin-left:6px;font-size:.62rem;color:#7a5200;font-weight:800;background:#fdf3d8;padding:2px 7px;border-radius:999px;border:1px solid #f5e3ad}
.tend .noti{color:var(--muted);font-size:.76rem;margin-top:2px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tend .links{margin-top:5px}
.tend .links a{font-size:.72rem;color:var(--azul2);text-decoration:none;font-weight:700;margin-right:10px}
.tend .thumb{width:46px;height:46px;border-radius:11px;object-fit:cover;flex:0 0 auto;border:1px solid var(--border)}

/* Noticias (estilo WeChat) */
.news-list{display:flex;flex-direction:column;gap:8px}
.news{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow-sm);text-decoration:none;color:var(--txt);display:flex;gap:11px;align-items:flex-start;transition:transform .18s}
.news:hover{transform:translateX(3px)}
.news .n-ava{width:40px;height:40px;min-width:40px;border-radius:50%;color:#fff;font-weight:800;font-size:1.1rem;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 -2px 0 rgba(0,0,0,.12)}
.news .n-body{flex:1;min-width:0}
.news .titulo{font-weight:600;font-size:.86rem;line-height:1.38;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.news .meta{color:var(--muted);font-size:.68rem;margin-top:4px;display:flex;gap:6px;align-items:center}
.news .meta .src{color:var(--azul2);font-weight:700}
.news .meta .dot-sep{opacity:.5}

/* Tiempo */
#weather-hero{background:linear-gradient(135deg,#0a5bbf 0%,#14b8ff 60%,#0ea5e9 100%);border-radius:18px;padding:16px;color:#fff;box-shadow:var(--shadow);margin-bottom:10px;display:flex;align-items:center;gap:14px;position:relative;overflow:hidden}
#weather-hero::after{content:"";position:absolute;inset:0;background:radial-gradient(50% 80% at 90% 0%,rgba(255,255,255,.18),transparent 60%)}
#weather-hero .wicon{font-size:2.8rem;line-height:1;filter:drop-shadow(0 3px 6px rgba(0,0,0,.25));position:relative;z-index:1}
#weather-hero .winfo{flex:1;position:relative;z-index:1}
#weather-hero .wcity{font-weight:700;font-size:.85rem;opacity:.92}
#weather-hero .wtemp{font-size:2.4rem;font-weight:900;line-height:1;letter-spacing:-.02em}
#weather-hero .wdesc{font-size:.82rem;opacity:.92;margin-top:1px}
#weather-hero .wmeta{display:flex;gap:12px;margin-top:6px;font-size:.72rem;opacity:.92;flex-wrap:wrap}
.w-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.w-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:13px;text-align:center;box-shadow:var(--shadow-sm);transition:transform .18s}
.w-card:hover{transform:translateY(-2px)}
.w-card .wicon{font-size:1.6rem;line-height:1}
.w-card .city{font-weight:700;font-size:.85rem;margin-top:5px}
.w-card .temp{font-size:1.5rem;font-weight:900;color:var(--azul2);margin:2px 0;letter-spacing:-.02em}
.w-card .desc{color:var(--muted);font-size:.72rem}
.w-card .range{color:var(--muted);font-size:.68rem;margin-top:2px;font-weight:600}

/* Divisas */
.divisas-grid{display:grid;grid-template-columns:1fr;gap:9px}
.divisa{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;box-shadow:var(--shadow-sm)}
.divisa .d-top{display:flex;align-items:center;gap:7px;margin-bottom:8px}
.divisa .flag{font-size:1.3rem;line-height:1}
.divisa .mon{font-size:.78rem;font-weight:700;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.divisa .valor{font-size:1.5rem;font-weight:900;color:var(--azul2);letter-spacing:-.01em;font-variant-numeric:tabular-nums;line-height:1.1}
.divisa .a{font-size:.8rem;color:var(--muted);font-weight:600;margin-left:4px}
.divisas-mas{grid-column:1/-1;background:none;border:1px dashed var(--border2);border-radius:12px;color:var(--azul2);font-weight:700;font-size:.78rem;padding:9px;cursor:pointer}
.divisas-extra{display:grid;grid-template-columns:1fr;gap:9px;grid-column:1/-1}

/* MLB */
.mlb-list{display:flex;flex-direction:column;gap:8px}
.mlb-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:11px 14px;box-shadow:var(--shadow-sm)}
.mlb-card .match{font-weight:700;font-size:.88rem}
.mlb-card .score{font-size:1.2rem;font-weight:900;color:var(--azul2);margin-top:2px;letter-spacing:-.01em}
.mlb-card .score .st{font-size:.68rem;color:var(--muted);font-weight:700;margin-left:5px}

/* Traductor */
.translator{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;box-shadow:var(--shadow-sm)}
.translator textarea{width:100%;min-height:84px;background:var(--bg);border:1px solid var(--border);border-radius:11px;color:var(--txt);padding:11px;font-size:.9rem;resize:vertical;font-family:inherit;transition:border-color .15s}
.translator textarea:focus{outline:none;border-color:var(--azul2);box-shadow:0 0 0 3px rgba(10,91,191,.15)}
.translator .row{display:flex;gap:7px;margin-top:10px;align-items:center}
.translator select,.translator button{padding:9px 12px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--txt);font-size:.84rem;font-weight:600}
.translator button{background:var(--grad);border:none;color:#fff;font-weight:800;cursor:pointer;box-shadow:0 4px 12px rgba(217,4,41,.24)}
.translator .out{background:var(--bg);border:1px solid var(--border);border-radius:11px;padding:11px;margin-top:10px;min-height:50px;font-size:.9rem;white-space:pre-wrap}

/* Compras + enlaces */
.links-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.link{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 6px;text-align:center;text-decoration:none;color:var(--txt);font-weight:700;font-size:.72rem;box-shadow:var(--shadow-sm);transition:transform .18s}
.link:hover{transform:translateY(-2px)}
.link .ico{font-size:1.4rem;display:block;margin-bottom:4px}
.link img{width:30px;height:30px;display:block;margin:0 auto 5px;border-radius:7px;object-fit:contain}

/* Tab bar */
.tabbar{flex:0 0 auto;height:var(--tab-h);background:var(--card);border-top:1px solid var(--border);display:flex;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -1px 8px rgba(13,27,51,.06)}
.tabbar button{flex:1;border:none;background:none;color:var(--muted);font-size:.62rem;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tabbar button .i{font-size:1.3rem;line-height:1}
.tabbar button.active{color:var(--rojo)}
.tabbar button.active .i{transform:scale(1.12)}
</style>
</head>
<body>
<div id="app">
  <div class="app-header">
    <img class="escudo" src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/26/Coat_of_arms_of_the_Dominican_Republic.svg/330px-Coat_of_arms_of_the_Dominican_Republic.svg.png" alt="" onerror="this.style.display='none'">
    <div class="t"><h1>Portal RD</h1><div class="lema">Dios · Patria · Libertad</div></div>
    <div class="updated" id="updated">…</div>
  </div>

  <div id="screens">
    <div class="screen active" id="scr-loteria">
      <h2 class="sec"><span class="bar"></span> Lotería de hoy <span class="meta" id="loteria-fecha"></span></h2>
      <div class="lot-grid" id="loteria-grid"><p style="color:var(--muted);font-size:.85rem">Cargando…</p></div>
    </div>

    <div class="screen" id="scr-mlb">
      <h2 class="sec"><span class="bar"></span> MLB — hoy</h2>
      <div class="mlb-list" id="mlb-grid"><p style="color:var(--muted);font-size:.85rem">Cargando…</p></div>
    </div>

    <div class="screen" id="scr-tendencias">
      <h2 class="sec"><span class="bar"></span> Tendencias Google <span class="meta" id="tendencias-updated"></span></h2>
      <div class="tend-list" id="tendencias-list"><p style="color:var(--muted);font-size:.85rem">Cargando…</p></div>
    </div>

    <div class="screen" id="scr-noticias">
      <h2 class="sec"><span class="bar"></span> Noticias <span class="meta" id="noticias-updated"></span></h2>
      <div class="news-list" id="noticias-list"><p style="color:var(--muted);font-size:.85rem">Cargando…</p></div>
    </div>

    <div class="screen" id="scr-tiempo">
      <h2 class="sec"><span class="bar"></span> Tiempo</h2>
      <div id="weather-hero"></div>
      <div class="w-grid" id="weather-grid"></div>
    </div>

    <div class="screen" id="scr-mas">
      <h2 class="sec"><span class="bar"></span> Traductor</h2>
      <div class="translator">
        <textarea id="tr-in" placeholder="Escribe algo…"></textarea>
        <div class="row">
          <select id="tr-from"><option value="es">Español</option><option value="en">English</option></select>
          <span style="color:var(--muted)">→</span>
          <select id="tr-to"><option value="en">English</option><option value="es">Español</option></select>
          <button id="tr-go">Traducir</button>
        </div>
        <div class="out" id="tr-out"></div>
      </div>

      <h2 class="sec"><span class="bar"></span> Compras</h2>
      <div class="links-grid">
        <a class="link" href="https://www.amazon.com" target="_blank" rel="noopener"><img src="https://www.google.com/s2/favicons?domain=amazon.com&sz=64" alt="Amazon" loading="lazy">Amazon</a>
        <a class="link" href="https://www.temu.com" target="_blank" rel="noopener"><img src="https://www.google.com/s2/favicons?domain=temu.com&sz=64" alt="Temu" loading="lazy">Temu</a>
        <a class="link" href="https://www.shein.com" target="_blank" rel="noopener"><img src="https://www.google.com/s2/favicons?domain=shein.com&sz=64" alt="Shein" loading="lazy">Shein</a>
        <a class="link" href="https://www.aliexpress.com" target="_blank" rel="noopener"><img src="https://www.google.com/s2/favicons?domain=aliexpress.com&sz=64" alt="AliExpress" loading="lazy">AliExpress</a>
        <a class="link" href="https://www.ebay.com" target="_blank" rel="noopener"><img src="https://cdn.simpleicons.org/ebay" alt="eBay" loading="lazy">eBay</a>
        <a class="link" href="https://www.mercadolibre.com.do" target="_blank" rel="noopener"><img src="https://www.google.com/s2/favicons?domain=mercadolibre.com.do&sz=64" alt="Mercado Libre" loading="lazy">Mercado Libre</a>
        <a class="link" href="https://www.corotos.com.do" target="_blank" rel="noopener"><img src="https://www.google.com/s2/favicons?domain=corotos.com.do&sz=64" alt="Corotos" loading="lazy">Corotos</a>
        <a class="link" href="https://www.youtube.com" target="_blank" rel="noopener"><img src="https://www.google.com/s2/favicons?domain=youtube.com&sz=64" alt="YouTube" loading="lazy">YouTube</a>
      </div>
    </div>
  </div>

  <div class="tabbar">
    <button data-tab="loteria" class="active"><span class="i">🎰</span>Lotería</button>
    <button data-tab="mlb"><span class="i">⚾</span>MLB</button>
    <button data-tab="noticias"><span class="i">📰</span>Noticias</button>
    <button data-tab="tiempo"><span class="i">🌤️</span>Tiempo</button>
    <button data-tab="mas"><span class="i">🔤</span>Más</button>
  </div>
</div>

<script>
// ---- Helpers fecha RD ----
function fmtFecha(iso){
  if (!iso) return '';
  try { const d = new Date(iso); return d.toLocaleDateString('es-DO',{timeZone:'America/Santo_Domingo',day:'numeric',month:'short'}); } catch(e){ return ''; }
}
function esHoyRD(iso){
  if (!iso) return false;
  try {
    const now = new Date();
    const hoy = new Date(now.toLocaleString('en-US',{timeZone:'America/Santo_Domingo'}));
    const d = new Date(iso);
    return d.getFullYear()===hoy.getFullYear() && d.getMonth()===hoy.getMonth() && d.getDate()===hoy.getDate();
  } catch(e){ return false; }
}

// ---- Tabs ----
document.querySelectorAll('.tabbar button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tabbar button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('scr-' + btn.dataset.tab).classList.add('active');
    document.getElementById('screens').scrollTop = 0;
  });
});

// ---- Lotería ----
fetch('data/resultados.json?v=1')
  .then(r => r.json()).then(d => {
    document.getElementById('updated').textContent = d.hora;
    document.getElementById('loteria-fecha').textContent = d.fecha;
    const grid = document.getElementById('loteria-grid');
    const byComp = {};
    d.juegos.forEach(j => (byComp[j.compania] = byComp[j.compania] || []).push(j));
    const order = ['Nacional','Anguila','Loteria Real','Loteka','La Primera','La Suerte','Leidsa'];
    const mainGame = {
      'Nacional': ['Lotería Nacional','Gana Más'],
      'Loteria Real': ['Lotería Real Noche','Quiniela Real'],
      'Loteka': ['Quiniela Loteka'],
      'La Primera': ['Primera Noche','La Primera Día'],
      'La Suerte': ['La Suerte 12:30','La Suerte 18:00'],
      'Leidsa': ['Quiniela Leidsa'],
    };
    grid.innerHTML = '';
    order.forEach(comp => {
      if (!byComp[comp]) return;
      const juegos = byComp[comp];
      juegos.sort((a, b) => {
        const am = (mainGame[comp] || []).indexOf(a.juego);
        const bm = (mainGame[comp] || []).indexOf(b.juego);
        const ar = am === -1 ? 99 : am;
        const br = bm === -1 ? 99 : bm;
        if (ar !== br) return ar - br;
        const ta = /(\d{1,2}):(\d{2})/.exec(a.juego);
        const tb = /(\d{1,2}):(\d{2})/.exec(b.juego);
        if (ta && tb) {
          const ha = (parseInt(ta[1]) % 12) + (/PM/i.test(a.juego) ? 12 : 0);
          const hb = (parseInt(tb[1]) % 12) + (/PM/i.test(b.juego) ? 12 : 0);
          if (ha !== hb) return ha - hb;
        }
        return a.juego.localeCompare(b.juego);
      });
      const head = document.createElement('div');
      head.className = 'lot-comp';
      head.textContent = comp;
      grid.appendChild(head);
      juegos.forEach(j => {
        const c = document.createElement('div');
        c.className = 'lot-card';
        const balls = j.numeros.map(n => '<span class="ball'+(j.numeros.length<=4?' gold':'')+'">'+n+'</span>').join('');
        const fecha = fmtFecha(j.fecha);
        const viejo = esHoyRD(j.fecha) ? '' : '<span class="lot-dia">día anterior</span>';
        c.innerHTML = '<div class="game">'+j.juego+'</div>'+(fecha||viejo?'<div class="lot-meta">'+(fecha?'<span class="lot-fecha">'+fecha+'</span>':'')+viejo+'</div>':'')+'<div class="nums">'+balls+'</div>';
        grid.appendChild(c);
      });
    });

fetch('data/noticias.json?v=1')
  .then(r => r.json()).then(d => {
    document.getElementById('noticias-updated').textContent = 'hace un momento';
    const list = document.getElementById('noticias-list');
    list.innerHTML = '';
    const colores = ['#0a5bbf','#d90429','#0d7a4f','#7c3aed','#b45309','#0e7490','#be185d','#1d4ed8'];
    d.noticias.slice(0, 10).forEach(n => {
      const a = document.createElement('a');
      a.className = 'news';
      a.href = n.enlace;
      a.target = '_blank';
      a.rel = 'noopener';
      let hash = 0; for (let c of n.fuente) hash = (hash * 31 + c.charCodeAt(0)) >>> 0;
      const color = colores[hash % colores.length];
      const inicial = (n.fuente[0] || '?').toUpperCase();
      const rel = tiempoRelativo(n.fecha);
      a.innerHTML = '<span class="n-ava" style="background:'+color+'">'+inicial+'</span><div class="n-body"><div class="titulo">'+n.titulo+'</div><div class="meta"><span class="src">'+n.fuente+'</span><span class="dot-sep">·</span><span>'+rel+'</span></div></div>';
      list.appendChild(a);
    });
  }).catch(() => document.getElementById('noticias-list').innerHTML = '<p style="color:var(--muted);font-size:.85rem">Error.</p>');

function tiempoRelativo(fechaStr){
  if (!fechaStr) return '';
  try {
    const d = new Date(fechaStr);
    const diff = (Date.now() - d.getTime()) / 1000;
    if (diff < 60) return 'ahora';
    if (diff < 3600) return 'hace ' + Math.floor(diff/60) + ' min';
    if (diff < 86400) return 'hace ' + Math.floor(diff/3600) + ' h';
    if (diff < 172800) return 'ayer';
    return 'hace ' + Math.floor(diff/86400) + ' días';
  } catch(e){ return ''; }
}

// ---- MLB ----
function mlbDate(){
  const now = new Date();
  const d = new Date(now.toLocaleString('en-US',{timeZone:'America/Santo_Domingo'}));
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
fetch('https://statsapi.mlb.com/api/v1/schedule?sportId=1&date=' + mlbDate(), {headers:{'Accept':'application/json'}})
  .then(r=>r.json()).then(d=>{
    const g = d.dates[0]?.games || [];
    const grid = document.getElementById('mlb-grid');
    if (!g.length){ grid.innerHTML = '<p style="color:var(--muted);font-size:.85rem">No hay juegos hoy.</p>'; return; }
    grid.innerHTML = '';
    g.forEach(game=>{
      const card = document.createElement('div');
      card.className = 'mlb-card';
      const st = game.status.abstractGameState;
      const stEs = {'Final':'Final','Live':'En vivo','Preview':'Previo','Pre-Game':'Previo','In Progress':'En curso','Scheduled':'Programado','Delayed':'Retrasado','Postponed':'Pospuesto'}[st] || st;
      const away = game.teams.away, home = game.teams.home;
      let score = '';
      if (st === 'Final' || st === 'Live'){
        score = '<div class="score">'+(away.score ?? '–')+' — '+(home.score ?? '–')+'<span class="st">'+stEs+'</span></div>';
      } else {
        const det = game.status.detailedState || '';
        const detEs = {'Scheduled':'Programado','Pre-Game':'Previo','In Progress':'En curso','Delayed':'Retrasado','Postponed':'Pospuesto','Final':'Final','Cancelled':'Cancelado'}[det] || det;
        score = '<div class="score" style="font-size:.85rem;color:var(--muted)">'+(detEs || stEs)+' · '+new Date(game.gameDate).toLocaleTimeString('es-DO',{hour:'2-digit',minute:'2-digit'})+'</div>';
      }
      card.innerHTML = '<div class="match">'+away.team.name+' @ '+home.team.name+'</div>'+score;
      grid.appendChild(card);
    });
  }).catch(()=> document.getElementById('mlb-grid').innerHTML = '<p style="color:var(--muted);font-size:.85rem">Error.</p>');

// ---- Traductor ----
document.getElementById('tr-go').addEventListener('click', translate);
function syncLangs(){
  const f = document.getElementById('tr-from').value, t = document.getElementById('tr-to').value;
  if (f === t) document.getElementById('tr-to').value = (f === 'es') ? 'en' : 'es';
}
document.getElementById('tr-from').addEventListener('change', syncLangs);
document.getElementById('tr-to').addEventListener('change', syncLangs);
async function translate(){
  const text = document.getElementById('tr-in').value.trim();
  if (!text) return;
  const from = document.getElementById('tr-from').value, to = document.getElementById('tr-to').value;
  const out = document.getElementById('tr-out');
  out.textContent = 'Traduciendo…';
  try {
    const r = await fetch('https://lingva.ml/api/v1/' + from + '/' + to + '/' + encodeURIComponent(text));
    const d = await r.json();
    if (d.translation) { out.textContent = d.translation; } else { throw new Error('sin traducción'); }
  } catch(e){ out.textContent = 'No se pudo traducir. Intenta de nuevo o usa el enlace de Google Traductor.'; }
}
