# Actualiza los datos del portal, regenera las páginas y publica en Cloudflare Pages.
#
# GitHub solo arranca unas pocas de las ejecuciones programadas al día, así que cada ejecución
# programada se queda activa ~5,5 horas y actualiza cada 20 minutos (scripts/ciclo.sh).
# Mientras una está activa, la siguiente programada espera en cola y arranca al terminar.
# Un push (cambio de código) hace una sola actualización inmediata, en paralelo.
name: Actualizar datos

on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch: {}   # botón "Run workflow" para arrancar un ciclo a mano
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: actualizar-${{ github.event_name == 'push' && 'push' || 'ciclo' }}
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT || 'portal-dominicano' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install --quiet pillow

      # push: 1 vuelta. Programada o manual: 16 vueltas cada 20 minutos (~5,5 h).
      - name: Actualizar y publicar
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            bash scripts/ciclo.sh 1 0
          else
            bash scripts/ciclo.sh 16 20
          fi

      # Deja constancia (anotación) de lo que ven los visitantes.
      - name: Comprobar sitio en vivo
        if: always()
        continue-on-error: true
        run: |
          sleep 30
          for u in https://portaldominicana.net/ https://portaldominicana.net/leidsa/ \
                   https://portaldominicana.net/anguila/10am/ https://portaldominicana.net/suenos/; do
            c=$(curl -sS -o /tmp/p.html -w '%{http_code}' "$u")
            t=$(grep -o -m1 'Actualizado[^<]*' /tmp/p.html | head -1)
            h=$(grep -o -m1 '<h1>[^<]*' /tmp/p.html | sed 's/<h1>//')
            echo "::notice title=En vivo::$u -> HTTP $c | ${h} | ${t:-sin fecha}"
          done
