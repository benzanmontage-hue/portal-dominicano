# Actualiza los datos del portal, regenera las páginas y publica en Cloudflare Pages.
#
# Repositorio público: cada ejecución programada se queda activa ~5,5 horas y actualiza cada
# 20 minutos (scripts/ciclo.sh). Repositorio privado: una actualización corta por hora.
# Mientras una está activa, la siguiente programada espera en cola y arranca al terminar.
# Un push (cambio de código) hace una sola actualización inmediata, en paralelo.
name: Actualizar datos

on:
  schedule:
    # Cada hora. Repo público: cada ejecución se queda ~5,5 h actualizando cada 20 min (de
    # madrugada en RD salta las vueltas). Repo privado: una actualización corta por ejecución.
    - cron: "37 * * * *"
  workflow_dispatch: {}   # botón "Run workflow" para arrancar un ciclo a mano
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: actualizar-${{ github.event_name == 'push' && 'push' || 'ciclo' }}
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT || 'portal-dominicano' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install --quiet pillow cryptography

      # Repositorio público (minutos gratis sin límite): las programadas se quedan ~5,5 h y
      # actualizan cada 20 min. Repositorio privado (2.000 min/mes gratis): una sola vuelta
      # corta (~2 min) por ejecución, una vez por hora, para no agotar los minutos.
      - name: Actualizar y publicar
        run: |
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event.repository.private }}" = "true" ]; then
            bash scripts/ciclo.sh 1 0
          else
            bash scripts/ciclo.sh 16 20
          fi

      # Deja constancia (anotación) de lo que ven los visitantes.
      - name: Comprobar sitio en vivo
        if: always() && (github.event_name != 'schedule' || !github.event.repository.private)
        continue-on-error: true
        run: |
          sleep 30
          for u in https://portaldominicana.net/ https://portaldominicana.net/leidsa/ \
                   https://portaldominicana.net/anguila/10am/ https://portaldominicana.net/suenos/ \
                   https://portaldominicana.net/numeros-que-mas-salen/ https://portaldominicana.net/feed.xml; do
            c=$(curl -sS -o /tmp/p.html -w '%{http_code}' "$u")
            t=$(grep -o -m1 'Actualizado[^<]*' /tmp/p.html | head -1)
            h=$(grep -o -m1 '<h1>[^<]*' /tmp/p.html | sed 's/<h1>//')
            echo "::notice title=En vivo::$u -> HTTP $c | ${h} | ${t:-sin fecha}"
          done
          a=$(curl -sS -w ' HTTP %{http_code}' https://portaldominicana.net/api/avisos | head -c 160)
          echo "::notice title=Avisos::/api/avisos -> $a"
