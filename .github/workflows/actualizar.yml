# Actualiza los datos del portal y regenera las páginas varias veces al día.
# Reemplaza al cron del servidor antiguo. Gratis en repositorios públicos.
name: Actualizar datos

on:
  schedule:
    # Hora UTC. En RD (UTC-4): 9:20, 11:20, 13:20, 15:20, 17:20, 19:20, 21:20 y 23:20.
    # La de 21:20 recoge Lotería Nacional y Leidsa; la de 23:20 la última Anguila.
    - cron: "20 1,3,13,15,17,19,21,23 * * *"
  workflow_dispatch: {}   # botón "Run workflow" para actualizar a mano
  push:
    branches: [main]      # publica también cuando se cambia el código

permissions:
  contents: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Descargar datos y regenerar páginas
        id: update
        run: python3 scripts/update_all.py
        continue-on-error: true

      - name: Publicar cambios
        run: |
          git config user.name "portal-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios."
            exit 0
          fi
          git commit -q -m "auto-update datos ($(TZ=America/Santo_Domingo date '+%d/%m/%Y %H:%M') RD)"
          git pull -q --rebase origin main
          git push -q origin HEAD:main

      # Publica en Cloudflare Pages (portaldominicana.net). Necesita dos "secrets" del repositorio:
      #   CLOUDFLARE_API_TOKEN  (permiso: Cloudflare Pages → Edit)
      #   CLOUDFLARE_ACCOUNT_ID
      # y opcionalmente la variable CF_PAGES_PROJECT (por defecto "portal-dominicano").
      # Si faltan, este paso se salta sin error.
      - name: Publicar en Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        env:
          PROYECTO: ${{ vars.CF_PAGES_PROJECT || 'portal-dominicano' }}
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' --exclude 'scripts' \
            --exclude 'screenshots' --exclude 'README.md' --exclude 'LICENSE' --exclude '.gitignore' \
            --exclude 'data/sitemap_estado.json' ./ _site/
          npx -y wrangler@3 pages deploy _site --project-name="$PROYECTO" --branch=main --commit-dirty=true

      # Borra la caché de Cloudflare para que portaldominicana.net muestre la versión nueva.
      # Necesita el secret CLOUDFLARE_ZONE_ID y que el token tenga el permiso "Zone → Cache Purge".
      - name: Borrar caché de Cloudflare
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ZONE_ID != ''
        run: |
          r=$(curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')
          echo "$r" | grep -q '"success":true' && echo "Caché borrada." || { echo "::warning::No se pudo borrar la caché: $r"; }

      - name: Avisar si falló la lotería
        if: steps.update.outcome == 'failure'
        run: |
          echo "::error::Falló la descarga de lotería o la generación de páginas. Revisa el paso anterior."
          exit 1
